name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta los lunes y jueves a las 00:00 UTC
    - cron: '0 0 * * 1,4'
  workflow_dispatch: # Permite probarlo manualmente desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/tickets?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_KEY }}"
